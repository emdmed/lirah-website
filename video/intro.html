<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lirah Intro Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/*
 * Intro. 43.5 s (re-paced 2026-10-23: the first cut at 30 s was too fast, the chapter cards most of all).
 *
 * A first look for developers who run CLI agents and have never heard of Lirah, told as a short lay
 * in four chapters (the film language in the lirah-video skill): the terminal, context, tabs, the
 * race, then the whole window under a full moon. Sources
 * (nevo-terminal PRODUCT.md, checked 2026-10-23): Ctrl+K launches the tab's CLI, Ctrl+Enter sends,
 * Alt+A jumps to the waiting agent (all in src/lib/shortcuts.js); EDIT/READ intents and the
 * full/signatures/skeleton detail levels; up to 8 tabs with activity lamps and context moons; race
 * of headless agents compared and applied; plans, git and budgets. Every session, file name, diff
 * count and moon fill is staged, so each app scene carries the illustrative label.
 */
.term { font-size: 28px; }
.term .warn { color: var(--warn); }
.hint { position: absolute; left: 0; right: 0; top: 750px; display: flex; justify-content: center; align-items: center; gap: 16px; font-family: var(--font-legend); font-size: 22px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

/* Files pane rows; rows in the prompt are in inverse video, the cursor is a lamp-coloured ›. */
.rows { font-size: 28px; line-height: 1.75; white-space: pre; }
.rows div { padding: 0 10px; }
.rows .dir { color: var(--muted); }
.rows [data-in] { background: var(--foreground); color: var(--background); }
.rows .cur::before { content: "› "; color: var(--lamp); }

.chips { display: flex; gap: 14px; flex-wrap: wrap; }
.chip em { font-style: normal; color: var(--muted); }
.ask { margin-top: 24px; font-size: 28px; line-height: 1.45; white-space: pre-wrap; }
.foot { position: absolute; left: 0; bottom: 0; display: flex; gap: 14px; align-items: center; font-family: var(--font-legend); font-size: 22px; color: var(--muted); }
.foot .cap, .hint .cap { font-size: 22px; }

/* Tabs and jobs rows in the workspace pane. */
.list { font-size: 32px; }
.list .row { display: grid; grid-template-columns: 40px 40px 1fr auto; gap: 18px; align-items: center; height: 96px; padding: 0 18px; border-bottom: 2px solid var(--edge); }
.list .row svg { width: 34px; height: 34px; }
.list .row .lampbox { display: grid; place-items: center; }
.list .row small { font-size: 24px; color: var(--muted); }
.list .row .st { font-family: var(--font-legend); font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.list .row[data-cur] { background: color-mix(in srgb, var(--foreground) 8%, transparent); }
.list .row[data-cur] .nm::before { content: "› "; color: var(--lamp); }
.list .head { font-size: 26px; color: var(--muted); padding: 6px 18px 18px; }
.diff { display: inline-flex; height: 10px; width: 120px; vertical-align: middle; margin-left: 14px; }
.diff i { display: block; height: 100%; }
.diff .a { background: var(--git-added); }
.diff .d { background: var(--git-deleted); }

/* The whole window, small. Lines are drawn as faint bars: it's the shape, not the text. */
#s-all .pane-body i { display: block; height: 12px; margin: 0 0 16px; background: var(--edge-strong); }
#s-all .pane-screen .pane-body i { background: color-mix(in srgb, var(--foreground) 22%, var(--glass)); }
.rail { position: absolute; left: 0; right: 0; top: 40px; height: 48px; display: flex; align-items: center; gap: 18px; font-family: var(--font-legend); font-size: 22px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.rail .mark { width: 40px; height: 40px; }
.rail svg.moon { width: 30px; height: 30px; }
</style>
</head>
<body>
<div id="stage">
  <header class="runhead"><span id="tag"></span></header>

  <!-- Frame 0 is the thumbnail: the title card is drawn at t = 0. -->
  <section class="scene" id="s-title"></section>
  <section class="scene" id="c1"></section>
  <section class="scene" id="s-term"><span class="illustrative">illustrative</span></section>
  <section class="scene" id="c2"></section>
  <section class="scene" id="s-ctx"><span class="illustrative">illustrative</span></section>
  <section class="scene" id="c3"></section>
  <section class="scene" id="s-tabs"><span class="illustrative">illustrative</span></section>
  <section class="scene" id="c4"></section>
  <section class="scene" id="s-jobs"><span class="illustrative">illustrative</span></section>
  <section class="scene" id="s-all"></section>
  <section class="scene" id="s-end"></section>

  <p class="caption" id="caption"></p>
  <svg class="clock" id="clock" viewBox="0 0 14 14" aria-hidden="true"></svg>
</div>
<script src="kit.js"></script>
<script>
(function () {
  'use strict';
  var F = window.Film, P = F.P, $ = F.$;

  /* ---------- build once ---------- */
  F.titleCard($('s-title'), 'A desktop workspace for CLI coding agents.');
  var tick = F.endCard($('s-end'));
  var ch1 = F.chapterCard($('c1'), 'I', 'Of the Terminal', 0.12);
  var ch2 = F.chapterCard($('c2'), 'II', 'Of Context Chosen', 0.2);
  var ch3 = F.chapterCard($('c3'), 'III', 'Of Many Agents', 0.3);
  var ch4 = F.chapterCard($('c4'), 'IV', 'Of the Race', 0.4);

  // 1 · terminal. Ctrl+K launches the tab's CLI in the real shell.
  $('s-term').insertAdjacentHTML('beforeend',
    F.pane({ id: 't1', index: 2, title: 'terminal', x: 0, y: 140, w: 936, h: 560, screen: true, focus: true, lamp: true }) +
    '<div class="hint">' + F.chord(['Ctrl', 'K'], 'k-launch') + ' launch the agent</div>');
  $('t1-body').innerHTML = '<div class="term"><span id="t1-sh"></span><div id="t1-out"></div></div>';
  var T1 = [
    '<span class="dim">Claude Code</span>',
    '<span class="faint">cwd ~/shop</span>',
    '',
    '<span class="faint">&gt;</span> <i class="caret"></i>'
  ];

  // 2 · context. Files go into the prompt with an intent and a detail level, then Ctrl+Enter.
  $('s-ctx').insertAdjacentHTML('beforeend',
    F.pane({ id: 'f2', index: 1, title: 'files', x: 0, y: 40, w: 340, h: 800 }) +
    F.pane({ id: 't2', index: 2, title: 'terminal', x: 364, y: 40, w: 572, h: 400, screen: true, lamp: true }) +
    F.pane({ id: 'p2', index: 3, title: 'prompt', x: 364, y: 464, w: 572, h: 376 }));
  var FILES = ['src/auth/', 'session.ts', 'token.ts', 'routes.ts', 'src/cart/', 'cart.ts', 'prices.ts'];
  $('f2-body').innerHTML = '<div class="rows">' + FILES.map(function (f, i) {
    return '<div id="fr' + i + '"' + (f.slice(-1) === '/' ? ' class="dir">' + f : '>  ' + f) + '</div>';
  }).join('') + '</div>';
  $('p2-body').innerHTML =
    '<div class="chips"><span class="chip" data-mode="edit" id="ch0"><i>EDIT</i>session.ts</span>' +
    '<span class="chip" data-mode="read" id="ch1"><i>READ</i>token.ts <em id="lvl">full</em></span></div>' +
    '<div class="ask" id="ask"></div>' +
    '<div class="foot">' + F.chord(['Ctrl', 'Enter'], 'k-send') + ' send</div>';
  $('t2-body').innerHTML = '<div class="term" id="t2-out"></div>';
  var ASK = 'Refresh the session when the token expires.';
  var T2 = [
    '<span class="faint">&gt;</span> Refresh the session…',
    '<span class="dim">● Read token.ts</span>',
    '<span class="lit">●</span> Update session.ts',
    '  <span class="add">+18</span> <span class="del">−4</span>'
  ];

  // 3 · tabs. Each row: context moon, activity lamp, name, branch. Alt+A jumps to the waiting one.
  var TABS = [['shop', 'main', 0.34], ['api', 'feat/auth', 0.71], ['docs', 'main', 0.12], ['infra', 'main', 0.05]];
  $('s-tabs').insertAdjacentHTML('beforeend',
    F.pane({ id: 'w3', index: 4, title: 'workspace', x: 0, y: 160, w: 936, h: 520, focus: true }) +
    '<div class="hint">' + F.chord(['Alt', 'A'], 'k-jump') + ' next agent waiting</div>');
  $('w3-body').innerHTML = '<div class="list"><div class="head">tabs</div>' + TABS.map(function (r, i) {
    return '<div class="row" id="tr' + i + '"><svg id="tm' + i + '" viewBox="0 0 14 14"></svg><span class="lampbox"><span class="lamp" id="tl' + i + '"></span></span>' +
      '<span class="nm">' + r[0] + ' <small>' + r[1] + '</small></span><span class="st" id="ts' + i + '"></span></div>';
  }).join('') + '</div>';

  // 4 · jobs. One task raced across three headless agents; compare, then apply one.
  var JOBS = [['codex', 64, 3], ['gemini', 42, 6], ['claude', 38, 2]];
  $('s-jobs').insertAdjacentHTML('beforeend',
    F.pane({ id: 'w4', index: 4, title: 'workspace', x: 0, y: 200, w: 936, h: 440, focus: true }));
  $('w4-body').innerHTML = '<div class="list"><div class="head">jobs · race · add cart tests</div>' + JOBS.map(function (j, i) {
    var tot = j[1] + j[2];
    return '<div class="row" id="jr' + i + '"><span></span><span class="lampbox"><span class="lamp" id="jl' + i + '"></span></span>' +
      '<span class="nm">' + j[0] + '<span class="diff" id="jd' + i + '"><i class="a" style="width:' + (j[1] / tot * 100) + '%"></i><i class="d" style="width:' + (j[2] / tot * 100) + '%"></i></span>' +
      ' <small id="jn' + i + '">+' + j[1] + ' −' + j[2] + '</small></span><span class="st" id="js' + i + '"></span></div>';
  }).join('') + '</div>';

  // 5 · the whole window: the terminal in the middle, the rest around it.
  function bars(n, seed) { var h = ''; for (var i = 0; i < n; i++) h += '<i style="width:' + (35 + 60 * F.hash(seed + i)).toFixed(0) + '%"></i>'; return h; }
  $('s-all').innerHTML =
    '<div class="rail" id="rail">' + F.mark(true) + '<span>shop · main</span><span style="flex:1"></span><svg class="moon" id="am" viewBox="0 0 14 14"></svg><span>context</span></div>' +
    F.pane({ id: 'a1', index: 1, title: 'files', x: 0, y: 120, w: 230, h: 720 }) +
    F.pane({ id: 'a2', index: 2, title: 'terminal', x: 254, y: 120, w: 424, h: 500, screen: true, focus: true, lamp: true }) +
    F.pane({ id: 'a3', index: 3, title: 'prompt', x: 254, y: 644, w: 424, h: 196 }) +
    F.pane({ id: 'a4', index: 4, title: 'workspace', x: 702, y: 120, w: 234, h: 720 });
  $('a1-body').innerHTML = bars(16, 1); $('a2-body').innerHTML = bars(11, 40);
  $('a3-body').innerHTML = bars(3, 80); $('a4-body').innerHTML = bars(9, 120);

  /* ---------- the film ---------- */
  // Chapter starts (glyph wipe centred on each) and action starts. Card ≈ 2.8 s, action 5–6 s.
  var C1 = 3.4, A1 = 6.2, C2 = 11.2, A2 = 14.0, C3 = 20.0, A3 = 22.8, C4 = 27.8, A4 = 30.6, ALL = 35.6, END = 39.2;

  F.mount({
    duration: 43.5,
    scenes: [
      { id: 's-title', s: 0 },
      { id: 'c1', s: C1, in: 'glyph' }, { id: 's-term', s: A1 },
      { id: 'c2', s: C2, in: 'glyph' }, { id: 's-ctx', s: A2 },
      { id: 'c3', s: C3, in: 'glyph' }, { id: 's-tabs', s: A3 },
      { id: 'c4', s: C4, in: 'glyph' }, { id: 's-jobs', s: A4 },
      { id: 's-all', s: ALL, in: 'glyph' },
      { id: 's-end', s: END, in: 'glyph' }
    ],
    tags: [[A1, C2, 'I · terminal'], [A2, C3, 'II · context'], [A3, C4, 'III · tabs'], [A4, ALL, 'IV · jobs']],
    captions: [
      [A1 + 0.3, C2 - 0.4, 'Your coding agent runs in a real terminal.'],
      [A2 + 0.3, C3 - 0.4, 'You choose the files it reads, and how much of each.'],
      [A3 + 0.3, C4 - 0.4, 'Agents in every tab. Alt+A jumps to the one waiting.'],
      [A4 + 0.3, ALL - 0.4, 'Race headless agents on a task. Keep the best diff.'],
      [ALL + 0.4, END - 0.4, 'Plans, git and token budgets around it, all by keyboard.']
    ],
    render: function (t) {
      ch1(t, C1); ch2(t, C2); ch3(t, C3); ch4(t, C4);

      // I · terminal: the prompt, a beat, Ctrl+K, the agent, then rest.
      var a = A1, launched = t >= a + 1.6;
      F.type($('t1-sh'), '~/shop ❯ ' + (launched ? 'claude' : ''), t, a, 999, !launched);
      F.press($('k-launch'), t >= a + 1.3 && t < a + 1.6);
      F.lines($('t1-out'), T1, t, launched ? a + 1.9 : 999, 0.25);
      F.lamp($('t1-lamp'), 'off');

      // II · context: rows go into the prompt, the READ file drops to signatures, then send.
      a = A2;
      $('fr1').toggleAttribute('data-in', t >= a + 0.8); $('fr2').toggleAttribute('data-in', t >= a + 1.4);
      $('fr1').classList.toggle('cur', t >= a + 0.3 && t < a + 1.1); $('fr2').classList.toggle('cur', t >= a + 1.1);
      F.warm($('ch0'), P(t, a + 0.8, a + 1.2)); F.warm($('ch1'), P(t, a + 1.4, a + 1.8));
      $('lvl').textContent = t >= a + 2.2 ? 'signatures' : 'full';
      var sent = t >= a + 4.8;
      F.type($('ask'), sent ? '' : ASK, t, a + 2.7, 28, !sent);
      F.press($('k-send'), t >= a + 4.5 && t < a + 4.8);
      F.focus($('p2'), !sent); F.focus($('t2'), sent);
      F.lamp($('t2-lamp'), sent ? 'on' : 'off');
      F.lines($('t2-out'), T2, t, sent ? a + 5.0 : 999, 0.25);

      // III · tabs: api stops to ask; Alt+A moves the cursor to it.
      a = A3;
      var waiting = t >= a + 1.4, jumped = t >= a + 3.1;
      TABS.forEach(function (r, i) {
        var fill = i === 0 ? r[2] + 0.12 * F.out3(P(t, a, a + 5)) : r[2];
        F.moon($('tm' + i), fill);
        var st = i === 0 ? 'on' : i === 1 ? (waiting ? 'warn' : 'on') : 'off';
        F.lamp($('tl' + i), st);
        $('ts' + i).textContent = st === 'on' ? 'working' : st === 'warn' ? 'waiting' : 'idle';
        $('tr' + i).toggleAttribute('data-cur', jumped ? i === 1 : i === 0);
      });
      F.press($('k-jump'), t >= a + 2.8 && t < a + 3.1);

      // IV · jobs: each finishes in turn and shows its diff; claude's is applied.
      a = A4;
      JOBS.forEach(function (j, i) {
        var at = a + [1.8, 1.2, 2.4][i], done = t >= at, applied = i === 2 && t >= a + 3.8;
        F.lamp($('jl' + i), done ? 'ok' : 'on');
        $('js' + i).textContent = applied ? '[applied]' : done ? 'done' : 'running';
        F.warm($('jd' + i), P(t, at, at + 0.4)); F.warm($('jn' + i), P(t, at, at + 0.4));
        $('jr' + i).toggleAttribute('data-cur', i === 2 && t >= a + 3.2);
      });

      // The whole window: panes warm up around the terminal, which is already lit.
      a = ALL;
      F.warm($('rail'), P(t, a + 0.5, a + 1.0));
      ['a1', 'a3', 'a4'].forEach(function (id, i) { F.warm($(id), P(t, a + 0.7 + i * 0.35, a + 1.2 + i * 0.35)); });
      F.lamp($('a2-lamp'), 'on');
      F.moon($('am'), 0.46);

      tick(t, END);
    }
  });
})();
</script>
</body>
</html>
